<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5S Rundgang Logistics HD</title>
    <!-- Tailwind CSS für modernes Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas für HD JPG-Downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        henkelRed: '#E1000F',
                        henkelRedDark: '#B8000C',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-ring:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(225, 0, 15, 0.3);
        }
        /* Versteckt den Standard "Datei auswählen" Input komplett */
        .visually-hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-12">

    <!-- Header mit Henkel Logo & Titel -->
    <header class="bg-henkelRed text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white rounded-full p-2 w-12 h-12 flex items-center justify-center shadow">
                    <svg class="w-8 h-8 text-henkelRed fill-current" viewBox="0 0 100 60">
                        <ellipse cx="50" cy="30" rx="45" ry="25" fill="none" stroke="#E1000F" stroke-width="6"/>
                        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-weight="bold" font-size="22" fill="#E1000F" font-family="Arial">Henkel</text>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">5S Rundgang</h1>
                    <p class="text-xs text-red-100">Logistics HD Standard</p>
                </div>
            </div>
            <div class="text-right">
                <span id="liveClock" class="text-sm font-semibold bg-henkelRedDark px-3 py-1 rounded-full text-white"></span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <form id="auditForm" onsubmit="event.preventDefault();" class="space-y-6">

            <!-- Stammdaten Card -->
            <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-henkelRed">
                <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">1. Stammdaten</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Name des Prüfers *</label>
                        <input type="text" id="inspectorName" required placeholder="Vorname Nachname" 
                            class="w-full border border-gray-300 rounded-lg p-2.5 custom-ring focus:border-henkelRed transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Bereich auswählen *</label>
                        <select id="location" required class="w-full border border-gray-300 rounded-lg p-2.5 custom-ring focus:border-henkelRed transition bg-white">
                            <option value="" disabled selected>-- Bitte Bereich wählen --</option>
                            <option value="Wareneingang">Wareneingang</option>
                            <option value="Tank & Silo">Tank & Silo</option>
                            <option value="Bau 24-25-26">Bau 24-25-26</option>
                            <option value="Bau 55">Bau 55</option>
                            <option value="Bau 54">Bau 54</option>
                            <option value="Bau 42">Bau 42</option>
                            <option value="Bau 46">Bau 46</option>
                            <option value="Bau 39">Bau 39</option>
                            <option value="Übergabeplätze">Übergabeplätze</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 5S Prüffragen Container -->
            <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-henkelRed">
                <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">2. 5S Checkliste</h2>
                <div id="questionsContainer" class="space-y-6">
                    <!-- Fragen werden per JS dynamisch generiert -->
                </div>
            </div>

            <!-- Sonstiges Card -->
            <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-henkelRed">
                <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">3. Sonstiges & Bemerkungen</h2>
                <div class="space-y-4">
                    <textarea id="otherText" rows="3" placeholder="Zusätzliche Anmerkungen oder Abweichungen..." 
                        class="w-full border border-gray-300 rounded-lg p-3 custom-ring focus:border-henkelRed transition"></textarea>
                    
                    <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-4 bg-gray-50">
                        <label class="block text-sm font-semibold text-gray-600 mb-3">Foto aufnehmen (Sonstiges)</label>
                        
                        <!-- VERSTECKTES INPUT -->
                        <input type="file" accept="image/*" capture="environment" id="otherImage" onchange="previewImage(this, 'preview_other')" 
                            class="visually-hidden-input">
                        
                        <!-- SICHTBARER BUTTON -->
                        <button type="button" id="btn_otherImage" onclick="document.getElementById('otherImage').click()"
                            class="bg-henkelRed hover:bg-henkelRedDark text-white font-bold py-2.5 px-5 rounded-lg shadow flex items-center space-x-2 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>Foto aufnehmen</span>
                        </button>

                        <!-- VORSCHAU -->
                        <div id="preview_other" class="mt-2 hidden text-center">
                            <img src="" alt="Vorschau" onclick="document.getElementById('otherImage').click()"
                                class="h-32 w-auto rounded-lg border-4 border-white shadow-md object-cover cursor-pointer hover:opacity-80 transition">
                            <p class="text-xs text-gray-500 mt-1">Tippen zum Ändern</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <div class="text-center pt-4">
                <button type="button" id="downloadBtn" onclick="generateHDImage()" 
                    class="bg-henkelRed hover:bg-henkelRedDark text-white font-bold py-4 px-10 rounded-2xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center mx-auto space-x-3 text-lg">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span>5S Protokoll als HD JPG herunterladen</span>
                </button>
            </div>
        </form>
    </main>

    <!-- Verstecktes Template (wird für HD JPG Render aufbereitet) -->
    <div style="position: absolute; left: -9999px; top: -9999px;">
        <div id="imageTemplate" class="p-8 bg-white w-[900px] text-gray-900 font-sans">
            <div class="flex justify-between items-center border-b-4 border-henkelRed pb-4 mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-henkelRed">5S RUNDGANG PROTOKOLL</h1>
                    <p class="text-sm text-gray-600 font-semibold tracking-wider">LOGISTICS HD STANDARD</p>
                </div>
                <div class="text-right">
                    <span class="text-3xl font-black text-henkelRed border-4 border-henkelRed px-4 py-1.5 rounded-full">Henkel</span>
                </div>
            </div>

            <div class="bg-gray-50 p-5 rounded-xl mb-6 grid grid-cols-2 gap-4 border border-gray-200 text-base">
                <div><strong>Prüfer:</strong> <span id="pdfInspector"></span></div>
                <div><strong>Bereich:</strong> <span id="pdfLocation"></span></div>
                <div class="col-span-2"><strong>Zeitstempel:</strong> <span id="pdfTimestamp"></span></div>
            </div>

            <div id="pdfQuestions" class="space-y-6 mb-6">
                <!-- Dynamischer Inhalt -->
            </div>

            <div id="pdfOtherSection" class="border-t-2 border-gray-200 pt-4">
                <h3 class="font-bold text-gray-800 text-lg mb-2">3. Sonstiges & Bemerkungen:</h3>
                <p id="pdfOtherText" class="text-sm bg-gray-50 p-4 rounded-lg border border-gray-200 min-h-[50px]"></p>
                <div id="pdfOtherImageContainer" class="mt-3 hidden">
                    <img id="pdfOtherImg" src="" class="max-h-72 rounded-lg border shadow-sm">
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            "Sind die Palettenplätze gereinigt?",
            "Werden Standards eingehalten?",
            "Sauberkeit Arbeitsplatz",
            "Defekte Betriebsmittel",
            "Dokumente auf dem aktuellen Stand?",
            "Checklisten ausgefüllt?"
        ];

        const imageStore = {};

        // Zeitstempel ohne Sekunden: "DD.MM.YYYY, HH:MM"
        function getFormattedTimestamp() {
            const now = new Date();
            return now.toLocaleString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function updateClock() {
            document.getElementById('liveClock').innerText = getFormattedTimestamp();
        }
        setInterval(updateClock, 10000); // Reicht alle 10 Sek da keine Sekundenanzeige
        updateClock();

        const container = document.getElementById('questionsContainer');
        questions.forEach((q, index) => {
            const qId = `q_${index}`;
            const card = document.createElement('div');
            card.className = "p-4 bg-gray-50 rounded-lg border border-gray-200 space-y-3";
            
            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                    <span class="font-semibold text-gray-800">${index + 1}. ${q}</span>
                    <div class="flex items-center space-x-4 bg-white p-1.5 rounded-lg border shadow-inner">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="${qId}_status" value="OK" checked class="text-henkelRed focus:ring-henkelRed h-5 w-5">
                            <span class="ml-2 text-sm text-green-700 font-bold">OK</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="${qId}_status" value="NOK" class="text-henkelRed focus:ring-henkelRed h-5 w-5">
                            <span class="ml-2 text-sm text-red-600 font-bold">NOK</span>
                        </label>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 items-center">
                    <input type="text" id="${qId}_text" placeholder="Bemerkung / Maßnahme..." 
                        class="w-full text-sm border border-gray-300 rounded-md p-2.5 bg-white custom-ring shadow-sm">
                    
                    <div class="flex items-center justify-center md:justify-start space-x-3">
                        <input type="file" accept="image/*" capture="environment" id="${qId}_file" 
                            onchange="previewImage(this, 'preview_${qId}', '${qId}')" 
                            class="visually-hidden-input">
                        
                        <button type="button" id="btn_${qId}" onclick="document.getElementById('${qId}_file').click()"
                            class="bg-gray-600 hover:bg-gray-700 text-white text-xs font-bold py-2 px-4 rounded-full shadow flex items-center space-x-1.5 transition whitespace-nowrap">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>Foto aufnehmen</span>
                        </button>

                        <div id="preview_${qId}" class="hidden">
                            <img src="" alt="Vorschau" onclick="document.getElementById('${qId}_file').click()"
                                class="h-12 w-12 rounded border-2 border-white shadow object-cover cursor-pointer hover:opacity-80 transition">
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        function previewImage(input, previewId, storeKey = null) {
            const file = input.files[0];
            const qId = storeKey || 'other';
            const btn = document.getElementById(`btn_${qId === 'other' ? 'otherImage' : qId}`);

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewDiv = document.getElementById(previewId);
                    const img = previewDiv.querySelector('img');
                    img.src = e.target.result;
                    
                    btn.classList.add('hidden');
                    previewDiv.classList.remove('hidden');

                    if(storeKey) {
                        imageStore[storeKey] = e.target.result;
                    } else if(previewId === 'preview_other') {
                        imageStore['other'] = e.target.result;
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateHDImage() {
            const name = document.getElementById('inspectorName').value.trim();
            const location = document.getElementById('location').value;

            if (!name || !location) {
                alert("Bitte füllen Sie den Namen und den Bereich aus.");
                return;
            }

            const downloadBtn = document.getElementById('downloadBtn');
            const originalBtnText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = `<span>Erstelle Ultra-HD Bild...</span>`;
            downloadBtn.disabled = true;

            // Zeitstempel im Protokoll ohne Sekunden festschreiben
            document.getElementById('pdfInspector').innerText = name;
            document.getElementById('pdfLocation').innerText = location;
            document.getElementById('pdfTimestamp').innerText = getFormattedTimestamp();

            const pdfQuestions = document.getElementById('pdfQuestions');
            pdfQuestions.innerHTML = '';

            questions.forEach((q, index) => {
                const qId = `q_${index}`;
                const status = document.querySelector(`input[name="${qId}_status"]:checked`).value;
                const note = document.getElementById(`${qId}_text`).value.trim();
                const imgSrc = imageStore[qId];

                const statusBg = status === 'OK' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';

                let qHtml = `
                    <div class="border-b border-gray-200 pb-4">
                        <div class="flex justify-between items-center font-bold text-base">
                            <span class="text-gray-900">${index + 1}. ${q}</span>
                            <span class="px-3 py-1 rounded-full text-sm ${statusBg}">${status}</span>
                        </div>
                        ${note ? `<p class="text-sm text-gray-700 mt-2 bg-gray-50 p-2.5 rounded border"><strong>Bemerkung:</strong> ${note}</p>` : ''}
                        ${imgSrc ? `<div class="mt-3"><img src="${imgSrc}" class="max-h-60 rounded-lg border shadow-sm"></div>` : ''}
                    </div>
                `;
                pdfQuestions.innerHTML += qHtml;
            });

            const otherText = document.getElementById('otherText').value.trim();
            document.getElementById('pdfOtherText').innerText = otherText || 'Keine Einträge';
            
            const pdfOtherContainer = document.getElementById('pdfOtherImageContainer');
            if (imageStore['other']) {
                document.getElementById('pdfOtherImg').src = imageStore['other'];
                pdfOtherContainer.classList.remove('hidden');
            } else {
                pdfOtherContainer.classList.add('hidden');
            }

            const element = document.getElementById('imageTemplate');
            
            try {
                // scale: 3 erzeugt ein Ultra-HD JPG Bild
                const canvas = await html2canvas(element, {
                    scale: 3, 
                    useCORS: true,
                    logging: false,
                    windowWidth: 900
                });

                // Export als JPG mit höchster Qualität (1.0)
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                
                // Automatischer Download der JPG-Datei
                const link = document.createElement('a');
                const dateClean = new Date().toISOString().slice(0,10);
                link.download = `5S_Rundgang_${location.replace(/\s+/g, '_')}_${dateClean}.jpg`;
                link.href = imgData;
                link.click();

            } catch (error) {
                console.error("JPG Export Fehler:", error);
                alert("Fehler beim Erstellen des HD-Bildes.");
            } finally {
                downloadBtn.innerHTML = originalBtnText;
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
